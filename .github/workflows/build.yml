name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Check mixin targets against Minecraft 26.2
        run: |
          JARS=$(find ~/.gradle/caches .gradle -name '*.jar' 2>/dev/null | grep -E 'minecraft-(merged|client|common|clientOnly)[^/]*\.jar$' | grep -v sources | sort -u)
          echo "::notice title=MC jars::$(echo "$JARS" | tr '\n' ' ')"
          CP=$(echo "$JARS" | paste -sd: -)
          check() {
            out=$(javap -p -cp "$CP" "$1" 2>&1 | grep -E "$2" | sed 's/^ *//')
            [ -z "$out" ] && out="NOTHING FOUND"
            echo "::notice title=$1::$(printf '%s' "$out" | sed ':a;N;$!ba;s/\n/%0A/g')"
          }
          check 'net.minecraft.client.gui.screens.inventory.AbstractContainerScreen' 'keyPressed|checkHotbarKeyPressed|hoveredSlot|slotClicked|[ .]menu;|getHoveredSlot|mouseDragged|extractSlot'
          check 'net.minecraft.client.renderer.blockentity.BeaconRenderer' ' submit\('
          check 'net.minecraft.client.multiplayer.ClientLevel$ClientLevelData' 'gameTime|getGameTime'
          check 'net.minecraft.world.entity.player.Inventory' ' items;|getFreeSlot'
          check 'net.minecraft.client.multiplayer.MultiPlayerGameMode' 'Minecraft minecraft|startDestroyBlock|void attack\('
          check 'net.minecraft.client.Options' ' gamma\(|genericValueLabel'
